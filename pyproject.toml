[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textora-engine"
version = "0.1.0"
description = "Textora Engine: Universal Video-to-Text & Dataset Collection Tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "youtube-transcript-api>=0.6.0",
    "langdetect>=1.0.9",
    "xxhash>=3.0.0",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0.0",
    "imageio-ffmpeg>=0.4.9",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.25.0",
]


[project.scripts]
textora-engine = "textora_engine.cli:main"
textora = "textora_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
