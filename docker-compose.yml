version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: textora-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TEXTORA_OUTPUT_DIR=/app/output
      - TEXTORA_LOG_LEVEL=INFO
    volumes:
      - textora-data:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  textora-data:
    driver: local
